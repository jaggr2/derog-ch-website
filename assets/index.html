<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>derog.ch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
  <style>
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); opacity: 1; }
      92% { transform: translate(-2px, 1px); opacity: 0.8; }
      94% { transform: translate(2px, -1px); opacity: 0.9; }
      96% { transform: translate(-1px, 2px); opacity: 0.7; }
      98% { transform: translate(1px, -2px); opacity: 0.95; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    body {
      background: linear-gradient(-45deg, #0f0c29, #1a1040, #24243e, #0d0d2b);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      min-height: 100vh;
    }
    .glitch-text { animation: glitch 4s infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s ease; }
    .card:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; animation: pulse-dot 2s infinite; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.5); }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
    .status-dot.checking { background: #eab308; box-shadow: 0 0 12px rgba(234, 179, 8, 0.5); }
    .shimmer-text { background: linear-gradient(90deg, #a78bfa, #e879f9, #a78bfa); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; }
    .badge { background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), rgba(232, 121, 249, 0.15)); border: 1px solid rgba(167, 139, 250, 0.3); backdrop-filter: blur(10px); }
    .service-icon { font-size: 1.5rem; }
    .fade-in { animation: fadeInUp 0.6s ease-out both; }
    ::selection { background: rgba(167, 139, 250, 0.3); }
  </style>
</head>
<body class="text-white antialiased flex flex-col min-h-screen">

  <div class="fixed top-4 right-4 z-50">
    <span class="badge px-3 py-1.5 rounded-full text-xs font-medium text-purple-300 inline-flex items-center gap-1.5">
      <span>🎓</span> educational project
    </span>
  </div>

  <main class="flex-1 flex flex-col items-center justify-center px-4 py-16">
    <div class="text-center mb-12 fade-in">
      <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-3 glitch-text">
        <span class="shimmer-text">derog.ch</span>
      </h1>

    </div>

    <div id="tunnel-status" class="mb-6 text-center text-xs text-purple-300/40 fade-in"></div>
    <div id="last-refreshed" class="mb-6 text-center text-xs text-purple-300/30 fade-in"></div>

    <div id="services" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-4xl fade-in">
      <div id="loading" class="col-span-full flex flex-col items-center gap-3 py-12">
        <div class="w-6 h-6 border-2 border-purple-400/30 border-t-purple-400 rounded-full animate-spin"></div>
        <span class="text-xs text-purple-300/40">loading services...</span>
      </div>
    </div>

    <div id="error" class="mt-8 text-center text-red-400/60 text-sm hidden"></div>

    <div class="mt-8 text-center">
      <button onclick="location.reload()" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-sm text-purple-300/50 hover:text-purple-300/80 transition-all duration-200">
        ↻ refresh
      </button>
    </div>
  </main>

  <footer class="text-center py-8 text-purple-300/30 text-xs">
    <p class="mb-1">self-hosted with ❤️  &nbsp;·&nbsp;  protected by Cloudflare  &nbsp;·&nbsp;  powered by a Raspberry Pi somewhere in Switzerland</p>
    <p>&copy; 2026 derog.ch</p>
  </footer>

  <script>
    const KNOWN = {
      ha:  { icon: '🏠', name: 'Home Assistant', desc: 'Smart home automation' },
      nas: { icon: '💾', name: 'NAS', desc: 'Network storage & backups' },
      kvm: { icon: '💻', name: 'KVM', desc: 'Virtualization & lab' },
    };
    const FALLBACK = { icon: '🔗', name: null, desc: null };

    const container = document.getElementById('services');
    const errorEl = document.getElementById('error');
    const tunnelEl = document.getElementById('tunnel-status');
    const refreshEl = document.getElementById('last-refreshed');
    let lastRefresh = null;

    function createCard(svc) {
      const known = KNOWN[svc.subdomain] || FALLBACK;
      const name = known.name || svc.subdomain;
      const card = document.createElement('div');
      card.className = 'card rounded-xl p-5 fade-in';
      card.style.animationDelay = '0.1s';
      card.innerHTML = `
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-center gap-3">
            <span class="service-icon">${known.icon}</span>
            <div>
              <h3 class="font-semibold text-sm">${name}</h3>
              ${known.desc ? `<p class="text-xs text-purple-300/50">${known.desc}</p>` : ''}
            </div>
          </div>
          <span class="status-dot checking" data-svc="${svc.subdomain}"></span>
        </div>
        <a href="${svc.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-purple-400/60 hover:text-purple-300/90 transition-colors font-mono">
          ${svc.subdomain === '@' ? 'derog.ch' : svc.subdomain + '.derog.ch'} ↗
        </a>
        <div class="mt-2 text-xs text-purple-300/50" data-latency="${svc.subdomain}"></div>
      `;
      return card;
    }

    async function load() {
      container.innerHTML = '';
      tunnelEl.textContent = '';
      errorEl.classList.add('hidden');
      const loading = document.getElementById('loading');

      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('API returned ' + res.status);
        const data = await res.json();

        if (data.tunnels) {
          const states = Object.values(data.tunnels);
          const healthy = states.filter(s => s === 'healthy').length;
          const total = states.length;
          const icon = states.every(s => s === 'healthy') ? '🟢' : states.some(s => s === 'healthy') ? '🟡' : '🔴';
          tunnelEl.textContent = `${icon} tunnel${total > 1 ? 's' : ''}: ${healthy}/${total} healthy`;
        }

        if (loading) loading.remove();
        lastRefresh = Date.now();
        updateRefreshTime();

        if (!data.services || data.services.length === 0) {
          container.innerHTML = '<div class="col-span-full text-center text-purple-300/40 text-sm">no proxied services found yet</div>';
          return;
        }

        data.services.forEach((svc, i) => {
          const card = createCard(svc);
          card.style.animationDelay = `${0.1 + i * 0.08}s`;
          container.appendChild(card);

          const dot = card.querySelector('[data-svc]');
          const latEl = card.querySelector('[data-latency]');
          if (dot) {
            dot.className = `status-dot ${svc.status === 'online' ? 'online' : 'offline'}`;
            dot.title = svc.status;
          }
          if (latEl) {
            if (svc.status === 'online' && svc.latency != null) {
              latEl.textContent = `${svc.latency}ms`;
            } else if (svc.status === 'offline') {
              latEl.textContent = 'unreachable';
              latEl.className = 'mt-2 text-xs text-red-400/50';
            }
          }
        });
      } catch (e) {
        if (loading) loading.remove();
        errorEl.textContent = '⚠ could not reach status API — services may be offline';
        errorEl.classList.remove('hidden');
      }
    }

    function updateRefreshTime() {
      if (!lastRefresh) { refreshEl.textContent = ''; return; }
      const sec = Math.floor((Date.now() - lastRefresh) / 1000);
      if (sec < 60) refreshEl.textContent = `last refreshed ${sec}s ago`;
      else refreshEl.textContent = `last refreshed ${Math.floor(sec / 60)}min ${sec % 60}s ago`;
    }

    load();
    setInterval(load, 60000);
    setInterval(updateRefreshTime, 1000);
  </script>
</body>
</html>
