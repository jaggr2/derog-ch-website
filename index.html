<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>derog.ch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
  <style>
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); opacity: 1; }
      92% { transform: translate(-2px, 1px); opacity: 0.8; }
      94% { transform: translate(2px, -1px); opacity: 0.9; }
      96% { transform: translate(-1px, 2px); opacity: 0.7; }
      98% { transform: translate(1px, -2px); opacity: 0.95; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    body {
      background: linear-gradient(-45deg, #0f0c29, #1a1040, #24243e, #0d0d2b);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      min-height: 100vh;
    }
    .glitch-text { animation: glitch 4s infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s ease; }
    .card:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; animation: pulse-dot 2s infinite; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.5); }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
    .status-dot.checking { background: #eab308; box-shadow: 0 0 12px rgba(234, 179, 8, 0.5); }
    .shimmer-text { background: linear-gradient(90deg, #a78bfa, #e879f9, #a78bfa); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; }
    .badge { background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), rgba(232, 121, 249, 0.15)); border: 1px solid rgba(167, 139, 250, 0.3); backdrop-filter: blur(10px); }
    .service-icon { font-size: 1.5rem; }
    .fade-in { animation: fadeInUp 0.6s ease-out both; }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.2s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    ::selection { background: rgba(167, 139, 250, 0.3); }
  </style>
</head>
<body class="text-white antialiased flex flex-col min-h-screen">

  <div class="fixed top-4 right-4 z-50">
    <span class="badge px-3 py-1.5 rounded-full text-xs font-medium text-purple-300 inline-flex items-center gap-1.5">
      <span>🎓</span> educational project
    </span>
  </div>

  <main class="flex-1 flex flex-col items-center justify-center px-4 py-16">
    <div class="text-center mb-12 fade-in">
      <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-3 glitch-text">
        <span class="shimmer-text">derog.ch</span>
      </h1>
      <p class="text-lg md:text-xl text-purple-300/70 font-light float">
        my little corner of the internet
      </p>
    </div>

    <div id="services" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-4xl fade-in">
    </div>

    <div class="mt-8 text-center">
      <button onclick="window.location.reload()" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-sm text-purple-300/50 hover:text-purple-300/80 transition-all duration-200">
        ↻ refresh status
      </button>
    </div>
  </main>

  <footer class="text-center py-8 text-purple-300/30 text-xs">
    <p class="mb-1">self-hosted with ❤️  &nbsp;·&nbsp;  protected by Cloudflare  &nbsp;·&nbsp;  powered by a Raspberry Pi somewhere in Switzerland</p>
    <p>&copy; 2026 derog.ch</p>
  </footer>

  <script>
    const services = [
      { name: 'Home Assistant', subdomain: 'ha', url: 'https://ha.derog.ch/', icon: '🏠', desc: 'Smart home automation' },
      { name: 'KVM', subdomain: 'kvm', url: 'https://kvm.derog.ch/', icon: '💻', desc: 'Virtualization & lab' },
      { name: 'NAS', subdomain: 'nas', url: 'https://nas.derog.ch/', icon: '💾', desc: 'Network storage & backups' },
    ];

    const container = document.getElementById('services');

    function createCard(svc) {
      const card = document.createElement('div');
      card.className = 'card rounded-xl p-5 fade-in';
      card.innerHTML = `
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-center gap-3">
            <span class="service-icon">${svc.icon}</span>
            <div>
              <h3 class="font-semibold text-sm">${svc.name}</h3>
              <p class="text-xs text-purple-300/50">${svc.desc}</p>
            </div>
          </div>
          <span class="status-dot checking" data-status="${svc.subdomain}"></span>
        </div>
        <a href="${svc.url}" target="_blank" rel="noopener noreferrer" class="text-xs text-purple-400/60 hover:text-purple-300/90 transition-colors font-mono">
          ${svc.subdomain}.derog.ch ↗
        </a>
        <div class="mt-2 text-xs" data-latency="${svc.subdomain}"></div>
      `;
      return card;
    }

    services.forEach(svc => container.appendChild(createCard(svc)));

    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('Status API unavailable');
        const data = await res.json();

        data.services.forEach(svc => {
          const dot = document.querySelector(`[data-status="${svc.subdomain}"]`);
          const latEl = document.querySelector(`[data-latency="${svc.subdomain}"]`);
          if (dot) {
            dot.className = `status-dot ${svc.status === 'online' ? 'online' : 'offline'}`;
            dot.title = svc.status === 'online' ? 'Online' : 'Offline';
          }
          if (latEl) {
            if (svc.status === 'online' && svc.latency) {
              latEl.textContent = `${svc.latency}ms`;
              latEl.className = 'mt-2 text-xs text-purple-300/50';
            } else if (svc.status === 'offline') {
              latEl.textContent = 'unreachable';
              latEl.className = 'mt-2 text-xs text-red-400/50';
            }
          }
        });
      } catch {
        document.querySelectorAll('.status-dot').forEach(d => {
          d.className = 'status-dot offline';
        });
      }
    }

    checkStatus();
    setInterval(checkStatus, 60000);
  </script>
</body>
</html>
